// ============================================================================
// Gemeinsame Datenbank-Anbindung (Supabase) — ersetzt die frühere reine
// localStorage-Version, damit Preisparameter, Positionslisten und Einstellungen
// zwischen allen Mitarbeitern/Geräten geteilt werden, statt pro Browser lokal
// zu bleiben. "aktiver_kunde_v1" (welcher Kunde gerade bearbeitet wird) bleibt
// bewusst lokal je Gerät, damit sich mehrere Mitarbeiter nicht gegenseitig den
// "aktuellen Kunden" wegschalten.
// ============================================================================
var __thbpClient = null;
(function () {
  var cfg = window.THBP_CONFIG || {};
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_URL.indexOf("HIER_") !== 0 && window.supabase && window.supabase.createClient) {
    try { __thbpClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); } catch (e) { __thbpClient = null; }
  }
})();

var LOCAL_ONLY_KEYS = { "aktiver_kunde_v1": true };

// -----------------------------------------------------------------------
// Offline-Warteschlange (Ausgangskorb): Speichert Änderungen an kv_store
// (Preise, Positionslisten, Einstellungen) und neue Kunden lokal zwischen,
// wenn gerade keine Verbindung besteht, und lädt sie automatisch hoch,
// sobald wieder Empfang da ist — analog zur Offline-Datenbank im
// Baustellenplaner (index.html), nur hier mit localStorage statt
// IndexedDB, weil der Konfigurator ohnehin schon localStorage-basiert ist.
// -----------------------------------------------------------------------
var OUTBOX_LS_KEY = "rk_outbox_v1";
function __loadOutbox() {
  try { return JSON.parse(localStorage.getItem(OUTBOX_LS_KEY) || "[]"); } catch (e) { return []; }
}
function __saveOutbox(items) {
  try { localStorage.setItem(OUTBOX_LS_KEY, JSON.stringify(items)); } catch (e) { }
}

  var items = __loadOutbox();
  items.push(Object.assign({ ts: Date.now() }, entry));
  __saveOutbox(items);

function __trySyncOutbox() {
  if (__outboxSyncing || !navigator.onLine || !__thbpClient) return Promise.resolve();
  __outboxSyncing = true;
  var items = __loadOutbox();
  var remaining = items.slice();
  var chain = Promise.resolve();
  items.forEach(function (item) {
    chain = chain.then(function () {
      var req;
      if (item.type === "kv-set") req = __thbpClient.from("kv_store").upsert({ key: item.key, value: item.value, updatedAt: new Date().toISOString() }, { onConflict: "key" });
      else if (item.type === "kv-delete") req = __thbpClient.from("kv_store").delete().eq("key", item.key);
      else if (item.type === "customer-insert") req = __thbpClient.from("customers").insert({ name: item.name, street: "", city: "", phone: "", createdAt: new Date().toISOString() });
      else req = Promise.resolve({ error: null });
      return req.then(function (res) {
        if (res.error) throw res.error;
        var i = remaining.indexOf(item);
        if (i >= 0) remaining.splice(i, 1);
        __saveOutbox(remaining);

  });

setTimeout(function () { __trySyncOutbox(); }, 1500);

var __kvCache = {};
var __kvLoadPromise = null;
function __kvEnsureLoaded() {
  if (__kvLoadPromise) return __kvLoadPromise;
  if (!__thbpClient) { __kvLoadPromise = Promise.resolve(); return __kvLoadPromise; }
  __kvLoadPromise = __thbpClient.from("kv_store").select("key,value").then(function (res) {
    if (res.data) res.data.forEach(function (row) { __kvCache[row.key] = row.value; });
  }).catch(function () { }).then(function () {
    // Noch nicht hochgeladene lokale Änderungen überlagern den (ggf. veralteten oder
    // wegen fehlendem Empfang gar nicht geladenen) Serverstand, damit eigene Eingaben
    // beim Neuladen nie verloren gehen oder kurz verschwinden.
    __loadOutbox().forEach(function (item) {
      if (item.type === "kv-set") __kvCache[item.key] = item.value;
      else if (item.type === "kv-delete") delete __kvCache[item.key];
    });
  });
  return __kvLoadPromise;
}

window.storage = {

    if (LOCAL_ONLY_KEYS[key]) {
      return new Promise(function (resolve, reject) {
        try {
          var raw = localStorage.getItem("rk_" + key);

        } catch (e) { reject(e); }
      });
    }

      if (!Object.prototype.hasOwnProperty.call(__kvCache, key)) throw new Error("not found");

    });
  },
  set: function (key, value, shared) {
    if (LOCAL_ONLY_KEYS[key]) {
      return new Promise(function (resolve, reject) {
        try {
          localStorage.setItem("rk_" + key, value);
          resolve({ key: key, value: value, shared: !!shared });
        } catch (e) { reject(e); }
      });
    }
    __kvCache[key] = value;
    if (!__thbpClient) return Promise.resolve({ key: key, value: value, shared: !!shared });
    return __thbpClient.from("kv_store").upsert({ key: key, value: value, updatedAt: new Date().toISOString() }, { onConflict: "key" }).then(function (res) {
      if (res.error) throw res.error;
      return { key: key, value: value, shared: !!shared };
    }).catch(function (e) {
      // Kein Empfang (oder Server-Fehler): Wert bleibt in __kvCache aktuell (s.o.), zusätzlich
      // in die Warteschlange legen, damit er automatisch hochgeladen wird, sobald es wieder geht.
      __pushOutbox({ type: "kv-set", key: key, value: value });
      return { key: key, value: value, shared: !!shared, queued: true };

  },
  delete: function (key, shared) {
    if (LOCAL_ONLY_KEYS[key]) {
      return new Promise(function (resolve, reject) {
        try {

          resolve({ key: key, deleted: true, shared: !!shared });
        } catch (e) { reject(e); }
      });
    }
    delete __kvCache[key];
    if (!__thbpClient) return Promise.resolve({ key: key, deleted: true, shared: !!shared });
    return __thbpClient.from("kv_store").delete().eq("key", key).then(function (res) {
      if (res.error) throw res.error;
      return { key: key, deleted: true, shared: !!shared };
    }).catch(function (e) {
      __pushOutbox({ type: "kv-delete", key: key });

    return __kvEnsureLoaded().then(function () {

};
