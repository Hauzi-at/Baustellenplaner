<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH Baustellenplaner</title>
<style>
  :root {
    --ink: #1c2b38;
    --ink-soft: #46596a;
    --slate: #4f7691;
    --slate-deep: #2f5069;
    --paper: #f2f0ea;
    --card: #ffffff;
    --card-raised: #fbfaf7;
    --line: #dde2e1;
    --muted: #6c7a80;
    --success: #2f7d5c;
    --success-bg: #e4f3ec;
    --warn: #b5741f;
    --warn-bg: #faf0dd;
    --danger: #b23b3b;
    --danger-bg: #fbe9e9;
    --focus: #4f7691;
    --shadow: 0 1px 2px rgba(28,43,56,0.06), 0 4px 14px rgba(28,43,56,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #edf1f4;
      --ink-soft: #c1cbd2;
      --slate: #86adc9;
      --slate-deep: #b3d0e4;
      --paper: #10161b;
      --card: #182129;
      --card-raised: #1e2831;
      --line: #2b373f;
      --muted: #8ea0a9;
      --success: #7bd1a4;
      --success-bg: #163527;
      --warn: #e4b169;
      --warn-bg: #3a2c14;
      --danger: #ea9494;
      --danger-bg: #3a1f1f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #edf1f4;
    --ink-soft: #c1cbd2;
    --slate: #86adc9;
    --slate-deep: #b3d0e4;
    --paper: #10161b;
    --card: #182129;
    --card-raised: #1e2831;
    --line: #2b373f;
    --muted: #8ea0a9;
    --success: #7bd1a4;
    --success-bg: #163527;
    --warn: #e4b169;
    --warn-bg: #3a2c14;
    --danger: #ea9494;
    --danger-bg: #3a1f1f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3, .display {
    font-family: 'Barlow Semi Condensed', 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--ink);
  }
  a { color: var(--slate-deep); }
  button { font-family: inherit; }
  input, select, textarea {
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  ::placeholder { color: var(--muted); opacity: 1; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Der Konfigurator lebt in einem eigenen <iframe> AUSSERHALB von #app, damit er beim
     Neuaufbau von #app (bei jeder Datenänderung, siehe render()) nicht mit-zerstört wird
     und sein Zustand (offene Eingaben etc.) erhalten bleibt. Position/Größe werden per
     JS (syncKonfiguratorFrame) exakt an Kopfzeile/Seitennav angepasst. */
  #konfigurator-frame { position: fixed; width: auto; height: auto; border: none; background: var(--card); z-index: 15; display: none; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .topbar img.logo { height: 34px; width: auto; max-width: 84px; object-fit: contain; display: block; flex-shrink: 0; }
  .topbar .title-block { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; overflow: hidden; }
  .topbar .title-block .app-name { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title-block .app-date { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .spacer { flex: 1; min-width: 8px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--card-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 6px 5px 12px;
    font-size: 13.5px;
    flex-shrink: 0;
  }
  .user-chip .name-txt { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 400px) {
    .topbar .title-block .app-date { display: none; }
    .topbar { gap: 8px; padding: 10px 12px; }
  }
  .user-chip .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--slate); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; font-family: 'Barlow Semi Condensed', sans-serif;
  }
  .user-chip button {
    background: none; border: none; color: var(--muted);
    font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 999px;
  }
  .user-chip button:hover { background: var(--line); color: var(--ink); }

  /* ---------- Layout shell ---------- */
  .shell { flex: 1; display: flex; min-height: 0; }
  .sidenav {
    display: none;
    flex-direction: column;
    width: 216px;
    padding: 18px 12px;
    border-right: 1px solid var(--line);
    background: var(--card);
    gap: 2px;
  }
  .navlink {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 9px;
    color: var(--ink-soft); text-decoration: none;
    font-size: 14.5px; font-weight: 600;
    background: none; border: none; cursor: pointer; text-align: left; width: 100%;
  }
  .navlink svg { flex-shrink: 0; }
  .navlink:hover { background: var(--card-raised); color: var(--ink); }
  .navlink.active { background: var(--slate); color: #fff; }

  main { flex: 1; min-width: 0; padding: 18px 16px 90px; max-width: 980px; margin: 0 auto; width: 100%; }

  .bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    z-index: 20; padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .bottomnav .navlink { flex-direction: column; gap: 3px; font-size: 11px; padding: 7px 4px; border-radius: 10px; }
  .bottomnav .navlink.active { background: var(--slate); color: #fff; }

  @media (min-width: 880px) {
    .sidenav { display: flex; }
    .bottomnav { display: none; }
    main { padding: 26px 32px 40px; max-width: 1100px; }
  }

  /* ---------- Generic components ---------- */
  .view { display: flex; flex-direction: column; gap: 16px; }
  .view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .view-head h1 { font-size: 24px; margin: 0; }
  .view-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 14px; font-weight: 600; padding: 9px 15px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--card-raised); }
  .btn-primary { background: var(--slate); border-color: var(--slate); color: #fff; }
  .btn-primary:hover { background: var(--slate-deep); border-color: var(--slate-deep); }
  .btn-ghost { background: none; border-color: transparent; color: var(--slate-deep); }
  .btn-ghost:hover { background: var(--card-raised); }
  .btn-danger { color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn-icon { padding: 7px; border-radius: 7px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .field .hint { font-size: 11.5px; color: var(--muted); }
  .field-row { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .field-row.cols-2 { grid-template-columns: 1fr 1fr; } .field-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; } }

  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 3px 9px; border-radius: 999px;
  }
  .tag.success { background: var(--success-bg); color: var(--success); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.info { background: var(--card-raised); color: var(--ink-soft); }

  .pause-panel { border: 1px dashed var(--warn); border-radius: 12px; padding: 14px; background: var(--warn-bg); display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .pause-panel h4 { margin: 0; font-size: 14px; }
  .pause-panel p { margin: 0; font-size: 12.5px; color: var(--muted); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 10px; padding: 44px 20px; color: var(--muted);
  }
  .empty-state svg { opacity: 0.55; }
  .empty-state h3 { margin: 0; font-size: 17px; color: var(--ink); }
  .empty-state p { margin: 0; max-width: 32ch; font-size: 13.5px; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    background: var(--warn-bg); color: var(--warn);
    border-radius: 10px; padding: 10px 14px; font-size: 13.5px; font-weight: 600;
  }

  /* ---------- Login screen ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--paper);
  }
  .login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; }
  .login-card img.logo { height: 46px; max-width: 220px; object-fit: contain; }
  .login-card h1 { font-size: 21px; margin: 0; }
  .login-card p { color: var(--muted); font-size: 13.5px; margin: 0; }
  .team-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .team-pick {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 13px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--ink);
  }
  .team-pick:hover { border-color: var(--slate); background: var(--card-raised); }
  .team-pick .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--slate); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700;
    font-family: 'Barlow Semi Condensed', sans-serif; flex-shrink: 0;
  }
  .team-pick .remove { margin-left: auto; background: none; border: none; color: var(--muted); padding: 4px; border-radius: 6px; cursor: pointer; }
  .team-pick .remove:hover { color: var(--danger); background: var(--danger-bg); }
  .add-person-row { display: flex; gap: 8px; width: 100%; }
  .add-person-row input { flex: 1; }

  /* ---------- Planning (week) ---------- */
  .week-nav { display: flex; align-items: center; gap: 8px; }
  .week-nav .label { font-weight: 600; font-size: 14px; min-width: 168px; text-align: center; }
  .week-grid-scroll { display: flex; flex-direction: column; }
  .week-grid {
    display: flex; flex-direction: column; gap: 12px;
  }
  @media (min-width: 880px) {
    /* Alle 7 Tage nebeneinander OHNE horizontales Scrollen — die Spalten passen sich der
       tatsächlich verfügbaren Breite an, statt eine feste Mindestbreite von 1000px zu
       erzwingen (das führte am PC dazu, dass Freitag/Samstag/Sonntag abgeschnitten wirkten). */
    .week-grid-scroll { overflow-x: auto; padding-bottom: 4px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: start; }
  }
  .day-card { display: flex; flex-direction: column; gap: 9px; }
  .day-card .day-head { display: flex; align-items: baseline; justify-content: space-between; }
  .day-card .day-head .wd { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14.5px; }
  .day-card .day-head .dd { font-size: 12px; color: var(--muted); }
  .day-card.today { border-color: var(--slate); }
  .assign-item {
    background: var(--card-raised); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; position: relative;
  }
  .assign-item .who { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .assign-item .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--slate); flex-shrink: 0; }
  .assign-item .what { font-size: 12.5px; color: var(--ink-soft); }
  .assign-item .note { font-size: 11.5px; color: var(--muted); }
  .assign-item .actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: 0; transition: opacity .1s; }
  .assign-item:hover .actions, .assign-item:focus-within .actions { opacity: 1; }
  .assign-item .actions button { background: none; border: none; color: var(--muted); padding: 3px; cursor: pointer; border-radius: 5px; }
  .assign-item .actions button:hover { color: var(--danger); background: var(--danger-bg); }
  .add-assign-btn {
    border: 1.5px dashed var(--line); background: none; color: var(--muted);
    border-radius: 9px; padding: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .add-assign-btn:hover { border-color: var(--slate); color: var(--slate-deep); }
  .assign-form { display: flex; flex-direction: column; gap: 7px; background: var(--card-raised); border: 1px solid var(--line); border-radius: 9px; padding: 9px; min-width: 0; }
  /* flex-wrap: Bei einer schmalen Tages-Spalte passen "Abbrechen" + "Zuweisen" nicht in eine Zeile —
     sie rutschen dann untereinander (voller, lesbarer Text) statt seitlich über den Rand hinaus
     abgeschnitten zu werden. */
  .assign-form .row-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; min-width: 0; }

  /* ---------- Customers ---------- */
  .search-input-wrap { position: relative; }
  .search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-input-wrap input { padding-left: 33px; width: 100%; }
  .customer-list { display: flex; flex-direction: column; gap: 8px; }
  .customer-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
  }
  .customer-row .initials {
    width: 36px; height: 36px; border-radius: 9px; background: var(--slate); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-family: 'Barlow Semi Condensed', sans-serif; flex-shrink: 0; font-size: 14px;
  }
  .customer-row .info { flex: 1; min-width: 0; }
  .customer-row .info .name { font-weight: 700; font-size: 14.5px; }
  .customer-row .info .addr { font-size: 12.5px; color: var(--muted); }
  .customer-row .actions { display: flex; gap: 4px; }

  /* ---------- Report form ---------- */
  .report-doc {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .report-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .report-head .company { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .report-head img.logo { height: 34px; max-width: 200px; object-fit: contain; background: #fff; padding: 6px 10px; border-radius: 8px; }
  .login-card img.logo { background: #fff; padding: 10px 16px; border-radius: 10px; }
  .type-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .type-choice {
    display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--card-raised);
  }
  .type-choice input { margin: 0; }
  .type-choice.checked { border-color: var(--slate); background: var(--slate); color: #fff; }
  .fixed-date-field { display: flex; gap: 6px; }
  .fixed-date-field input { flex: 1; background: var(--card-raised); }
  .section-title { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); margin: 0; }
  .customer-suggest { position: relative; }
  .suggest-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); max-height: 230px; overflow-y: auto; padding: 5px;
  }
  .suggest-item { padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
  .suggest-item:hover, .suggest-item.hi { background: var(--card-raised); }
  .suggest-item .n { font-weight: 700; }
  .suggest-item .a { font-size: 11.5px; color: var(--muted); }
  .suggest-item.add-new { color: var(--slate-deep); font-weight: 700; }

  .sig-block { display: flex; flex-direction: column; gap: 8px; }
  /* Fest definiert (statt von einem umgebenden .field abhängig) — sonst wirkt "Unterschrift
     Monteur" (steht direkt in der Zeile, nicht in einem .field-Wrapper wie "Unterschrift
     Kunde") als großes Standard-Label, während "Unterschrift Kunde" klein/dezent bleibt. */
  .sig-block > label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .sig-pad-wrap { border: 1.5px dashed var(--line); border-radius: 10px; background: var(--card-raised); position: relative; touch-action: none; }
  .sig-pad-wrap canvas { display: block; width: 100%; height: 140px; touch-action: none; cursor: crosshair; }
  .sig-pad-wrap .sig-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; pointer-events: none; }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* Vollbild-Unterschrift — nutzt fast das ganze Display, damit auf dem Handy mehr Platz zum
     Unterschreiben da ist als im kleinen Feld im Formular. */
  .sig-fullscreen { position: fixed; inset: 0; z-index: 80; background: var(--paper); display: flex; flex-direction: column; gap: 12px; padding: 14px; }
  .sig-fullscreen-head { display: flex; justify-content: space-between; align-items: center; }
  .sig-fullscreen-head strong { font-size: 16px; }
  .sig-fullscreen-pad { flex: 1; min-height: 0; }
  .sig-fullscreen-pad canvas { height: 100%; }
  .sig-fullscreen-actions { flex-shrink: 0; }
  .sig-caption { font-size: 11.5px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); padding-top: 6px; }

  .prefill-chip {
    display: flex; align-items: center; gap: 8px; background: var(--success-bg); color: var(--success);
    border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; width: 100%; text-align: left;
  }

  /* ---------- Archive ---------- */
  .picker-banner { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; background: var(--card-raised); border: 1.5px solid var(--slate); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .archive-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .archive-filters select, .archive-filters input { font-size: 13px; padding: 7px 10px; }
  .report-list { display: flex; flex-direction: column; gap: 8px; }
  .report-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px; cursor: pointer;
  }
  .report-row:hover { border-color: var(--slate); }
  .report-row .rtype { width: 4px; align-self: stretch; border-radius: 3px; background: var(--slate); flex-shrink: 0; }
  .report-row .info { flex: 1; min-width: 0; }
  .report-row .info .n { font-weight: 700; font-size: 14px; }
  .report-row .info .m { font-size: 12px; color: var(--muted); }
  .report-row .date { font-size: 12.5px; color: var(--muted); text-align: right; flex-shrink: 0; }

  /* ---------- Modal / sheet ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(16,22,27,0.5); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 20px; } }
  .modal-sheet {
    background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  @media (min-width: 640px) { .modal-sheet { border-radius: 16px; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-head h2 { font-size: 18px; margin: 0; }
  .modal-head button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; }

  /* ---------- Print ---------- */
  #print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area {
      display: block !important; position: absolute; top: 0; left: 0; width: 100%; padding: 16mm 18mm;
      color: #1c2b38; background: #fff; font-family: Arial, sans-serif;
      --p-accent: var(--slate-deep, #2f5069);
      --p-accent-soft: var(--slate, #4f7691);
      --p-tint: #f4f6f5;
      --p-line: #d8dcd8;
    }
    .p-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 3px solid var(--p-accent); padding-bottom: 14px; margin-bottom: 16px; }
    .p-header img { height: 74px; width: 74px; object-fit: contain; flex-shrink: 0; }
    .p-header .company-name { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--p-accent-soft); font-weight: 700; margin-bottom: 3px; }
    .p-header .company { font-size: 10.5px; line-height: 1.55; color: #46596a; }
    .p-type-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--p-accent); color: #fff; font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
    .p-type-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; margin-bottom: 4px; }
    .p-field { border-bottom: 1px solid var(--p-line); padding: 6px 2px; font-size: 12.5px; margin-bottom: 9px; }
    .p-field .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--p-accent-soft); font-weight: 600; display: block; margin-bottom: 1px; }
    .p-block { background: var(--p-tint); border-left: 3px solid var(--p-accent); border-radius: 0 6px 6px 0; margin-bottom: 12px; }
    .p-block .l { font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--p-accent); padding: 8px 12px 0; }
    .p-block .c { padding: 4px 12px 10px; font-size: 12.5px; min-height: 20px; white-space: pre-wrap; }
    .p-sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 20px; }
    .p-sig-box { background: var(--p-tint); border-radius: 6px; padding: 10px 12px 8px; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; }
    .p-sig-box img { height: 110px; display: block; margin-bottom: 2px; object-fit: contain; object-position: left bottom; max-width: 100%; }
    .p-sig-line { border-top: 1px solid var(--p-accent-soft); padding-top: 5px; font-size: 10.5px; color: #46596a; }
  }

  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------------- boot ---------------- */
  document.addEventListener("DOMContentLoaded", boot);
  function boot() {
    try { currentUser = localStorage.getItem("thbp_user") || null; } catch (e) { currentUser = null; }
    render();
    connectDb();
    window.addEventListener("resize", syncKonfiguratorFrame);
    window.addEventListener("online", function () { isOnline = true; render(); });
    window.addEventListener("offline", function () { isOnline = false; render(); });
    if ("serviceWorker" in navigator) {
      // Läuft die Seite von "file://" (statt http/https), lehnt der Browser Service Worker
      // grundsätzlich ab — dann einfach ohne Offline-Zwischenspeicher weiterlaufen.
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }

  function offlineBannerText() {
    var plural = pendingSyncCount !== 1;
    if (!isOnline && pendingSyncCount > 0) {
      return "Kein Empfang — du arbeitest offline weiter. " + pendingSyncCount + " Änderung" + (plural ? "en" : "") + " " + (plural ? "werden" : "wird") + " automatisch hochgeladen, sobald wieder Verbindung besteht.";
    }
    if (!isOnline) {
      return "Kein Empfang — du arbeitest offline weiter. Deine Eingaben werden gespeichert und automatisch hochgeladen, sobald wieder Verbindung besteht.";
    }
    return pendingSyncCount + " Änderung" + (plural ? "en" : "") + " " + (plural ? "werden" : "wird") + " gerade hochgeladen …";
  }

  function dbStatusMessage() {
    if (dbStatusDetail === "config") return "Einrichtung unvollständig — bitte Supabase-URL & Key in der Datei eintragen (siehe Einrichtungsanleitung).";
    if (dbStatusDetail === "library") return "Datenbank-Bibliothek konnte nicht geladen werden — bitte Internetverbindung prüfen und Seite neu laden.";
    return "Keine Verbindung zur Datenbank — Änderungen können gerade nicht gespeichert werden.";
  }

  function connectDb() {
    var cfg = window.THBP_CONFIG || {};
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.indexOf("HIER_") === 0) {
      dbStatus = "unavailable";
      dbStatusDetail = "config";
      render();
      return;
    }
    if (!window.supabase || !window.supabase.createClient) {
      dbStatus = "unavailable";
      dbStatusDetail = "library";
      render();
      return;
    }
    try {
      var client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      rawClient = client;
      db = createOfflineDb(client, function (count) {
        pendingSyncCount = count;
        render();
      });
      dbStatus = "ready";
      subscribe("customers", "customers");
      subscribe("assignments", "assignments");
      subscribe("reports", "reports");
      subscribe("team", "team");
      subscribe("settings", "settings");
      subscribe("hours", "hours");
      render();
    } catch (e) {
      dbStatus = "unavailable";
      dbStatusDetail = "error";
      render();
    }
  }

  function subscribe(path, key) {
    db.collection(path).limit(500).onSnapshot(function (snap) {
      state[key] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded[key] = true;
      render();
    }, function () { loaded[key] = true; render(); });
  }

  /* =====================================================================
     Supabase-Anbindung — bildet dieselbe kleine Schnittstelle nach
     (collection().onSnapshot/add, doc().update/delete), die der Rest der
     App verwendet, damit oben nichts angepasst werden musste.
     ===================================================================== */
  function createSupabaseDb(client) {
    var channelCounter = 0;

    function collection(name) {
      return {
        limit: function () { return this; },
        onSnapshot: function (next, err) {
          var stopped = false;
          function fetchAll() {
            client.from(name).select("*").then(function (res) {
              if (stopped) return;
              if (res.error) { if (err) err({ code: "unavailable", message: res.error.message }); return; }
              var rows = res.data || [];
              var docs = rows.map(function (row) {
                var id = row.id;
                return {
                  id: id,
                  exists: true,
                  data: function () { var c = Object.assign({}, row); delete c.id; return c; }
                };
              });
              next({ docs: docs, size: docs.length, empty: docs.length === 0, docChanges: function () { return []; }, metadata: { fromCache: false, hasPendingWrites: false } });
            }).catch(function (e) { if (err) err({ code: "unavailable", message: String(e) }); });
          }
          fetchAll();
          channelCounter++;
          var channel = client.channel("thbp-" + name + "-" + channelCounter)
            .on("postgres_changes", { event: "*", schema: "public", table: name }, function () { if (!stopped) fetchAll(); })
            .subscribe();
          return function () { stopped = true; try { client.removeChannel(channel); } catch (e) {} };
        },
        add: function (data) {
          return client.from(name).insert(data).select().single().then(function (res) {
            if (res.error) throw res.error;
            return { id: res.data.id };
          });
        }
      };
    }

    function doc(path) {
      var idx = path.lastIndexOf("/");
      var name = path.slice(0, idx), id = path.slice(idx + 1);
      return {
        id: id,
        update: function (data) {
          return client.from(name).update(data).eq("id", id).then(function (res) {
            if (res.error) throw res.error;
          });
        },
        delete: function () {
          return client.from(name).delete().eq("id", id).then(function (res) {
            if (res.error) throw res.error;
          });
        }
      };
    }

    return { collection: collection, doc: doc };
  }

  /* =====================================================================
     Offline-Datenbank — spiegelt Supabase in IndexedDB, damit die App auf
     der Baustelle auch ohne (oder mit schlechtem) Empfang benutzbar bleibt.
     Bietet dieselbe Schnittstelle wie createSupabaseDb() (collection/doc),
     speichert Änderungen aber zuerst lokal und lädt sie im Hintergrund
     hoch, sobald wieder eine Verbindung besteht ("Ausgangskorb"/Outbox).
     ===================================================================== */
  var IDB_NAME = "thbp_offline_v1";
  var IDB_TABLES = ["customers", "assignments", "reports", "team", "settings", "hours"];

  function openOfflineDb() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error("IndexedDB nicht verfügbar")); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        IDB_TABLES.forEach(function (t) {
          if (!d.objectStoreNames.contains(t)) d.createObjectStore(t, { keyPath: "id" });
        });
        if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true });
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function createOfflineDb(client, onPendingChange) {
    var idbReady = openOfflineDb();
    var listenersByTable = {}; // table -> [{ next, err }]
    var localCache = {}; // table -> array of rows (letzter an die App gemeldeter Stand)
    var pendingCount = 0;
    var channelCounter = 0;

    function idbAll(store) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var req = d.transaction(store, "readonly").objectStore(store).getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { resolve([]); };
        });
      });
    }
    function idbGet(table, id) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var req = d.transaction(table, "readonly").objectStore(table).get(id);
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { resolve(null); };
        });
      });
    }
    function idbPut(table, row) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var tx = d.transaction(table, "readwrite");
          tx.objectStore(table).put(row);
          tx.oncomplete = resolve; tx.onerror = resolve;
        });
      });
    }
    function idbDelete(table, id) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var tx = d.transaction(table, "readwrite");
          tx.objectStore(table).delete(id);
          tx.oncomplete = resolve; tx.onerror = resolve;
        });
      });
    }
    function idbReplaceAll(table, rows) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var tx = d.transaction(table, "readwrite");
          var store = tx.objectStore(table);
          store.clear();
          rows.forEach(function (r) { store.put(r); });
          tx.oncomplete = resolve; tx.onerror = resolve;
        });
      });
    }
    function idbAddOutbox(entry) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var tx = d.transaction("outbox", "readwrite");
          tx.objectStore("outbox").add(entry);
          tx.oncomplete = resolve; tx.onerror = resolve;
        });
      });
    }
    function idbDeleteOutbox(seq) {
      return idbReady.then(function (d) {
        return new Promise(function (resolve) {
          var tx = d.transaction("outbox", "readwrite");
          tx.objectStore("outbox").delete(seq);
          tx.oncomplete = resolve; tx.onerror = resolve;
        });
      });
    }

    function updatePendingBadge() {
      idbAll("outbox").then(function (items) {
        // Nur bei einer tatsächlichen Änderung die Anzeige (und damit ein render()) anstoßen —
        // sonst würde der Hintergrund-Sync-Check (alle 20 Sek., siehe setInterval unten) beim
        // Tippen ständig einen komplett neuen Bildschirmaufbau auslösen und den Eingabefokus
        // aus dem Feld reißen, obwohl sich gar nichts geändert hat.
        var changed = items.length !== pendingCount;
        pendingCount = items.length;
        if (changed && typeof onPendingChange === "function") onPendingChange(pendingCount);
      });
    }

    function emit(table) {
      var rows = localCache[table] || [];
      var payload = {
        docs: rows.map(function (row) {
          var id = row.id;
          return { id: id, exists: true, data: function () { var c = Object.assign({}, row); delete c.id; return c; } };
        }),
        size: rows.length,
        empty: rows.length === 0,
        docChanges: function () { return []; },
        metadata: { fromCache: !navigator.onLine, hasPendingWrites: pendingCount > 0 }
      };
      (listenersByTable[table] || []).forEach(function (l) { l.next(payload); });
    }

    function loadLocalThenEmit(table) {
      return idbAll(table).then(function (rows) { localCache[table] = rows; emit(table); });
    }

    // Baut den Datensatz zusammen, der angezeigt werden soll: der zuletzt vom Server
    // geladene Stand, überlagert mit noch nicht hochgeladenen lokalen Änderungen — so
    // verschwinden eigene Eingaben nie wieder, auch wenn der Server (noch) nichts davon weiß.
    function overlayOutbox(table, remoteRows) {
      return idbAll("outbox").then(function (outbox) {
        var byId = {};
        remoteRows.forEach(function (r) { byId[r.id] = Object.assign({}, r); });
        outbox.filter(function (o) { return o.table === table; })
          .sort(function (a, b) { return a.seq - b.seq; })
          .forEach(function (o) {
            if (o.op === "insert") byId[o.id] = Object.assign({ id: o.id }, o.data);
            else if (o.op === "update") byId[o.id] = Object.assign({ id: o.id }, byId[o.id] || {}, o.data);
            else if (o.op === "delete") delete byId[o.id];
          });
        return Object.keys(byId).map(function (k) { return byId[k]; });
      });
    }

    function fetchAndEmit(table) {
      return client.from(table).select("*").then(function (res) {
        if (res.error) throw res.error;
        return overlayOutbox(table, res.data || []);
      }).then(function (merged) {
        return idbReplaceAll(table, merged).then(function () { localCache[table] = merged; emit(table); });
      }).catch(function () {
        // Kein Netz oder Fehler: die zuletzt lokal gespeicherten Daten bleiben sichtbar (s.o.).
      });
    }

    function trySyncOutbox() {
      if (!navigator.onLine) return Promise.resolve();
      return idbAll("outbox").then(function (items) {
        items.sort(function (a, b) { return a.seq - b.seq; });
        var touched = {};
        var chain = Promise.resolve();
        items.forEach(function (item) {
          chain = chain.then(function () {
            var req;
            if (item.op === "insert") req = client.from(item.table).insert(Object.assign({ id: item.id }, item.data));
            else if (item.op === "update") req = client.from(item.table).update(item.data).eq("id", item.id);
            else req = client.from(item.table).delete().eq("id", item.id);
            return req.then(function (res) {
              if (res.error) throw res.error;
              return idbDeleteOutbox(item.seq);
            }).then(function () { touched[item.table] = true; });
          });
        });
        return chain.then(function () {
          updatePendingBadge();
          return Promise.all(Object.keys(touched).map(fetchAndEmit));
        }).catch(function () {
          // Ein Eintrag ist fehlgeschlagen (z.B. Verbindung gerade weg) — Reihenfolge bleibt
          // erhalten, der Rest wird beim nächsten Versuch erneut probiert.
          updatePendingBadge();
        });
      });
    }

    window.addEventListener("online", function () { trySyncOutbox(); });
    setInterval(function () { trySyncOutbox(); }, 20000);
    updatePendingBadge();
    trySyncOutbox();

    function collection(name) {
      return {
        limit: function () { return this; },
        onSnapshot: function (next, err) {
          listenersByTable[name] = listenersByTable[name] || [];
          var listener = { next: next, err: err };
          listenersByTable[name].push(listener);
          loadLocalThenEmit(name).then(function () { fetchAndEmit(name); });
          var channel = null;
          try {
            channelCounter++;
            channel = client.channel("thbp-off-" + name + "-" + channelCounter)
              .on("postgres_changes", { event: "*", schema: "public", table: name }, function () { fetchAndEmit(name); })
              .subscribe();
          } catch (e) {}
          return function () {
            var arr = listenersByTable[name] || [];
            var i = arr.indexOf(listener);
            if (i >= 0) arr.splice(i, 1);
            if (channel) { try { client.removeChannel(channel); } catch (e) {} }
          };
        },
        add: function (data) {
          var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid();
          var row = Object.assign({ id: id }, data);
          return idbPut(name, row)
            .then(function () { return idbAddOutbox({ table: name, op: "insert", id: id, data: data, ts: Date.now() }); })
            .then(function () { return loadLocalThenEmit(name); })
            .then(function () { updatePendingBadge(); trySyncOutbox(); return { id: id }; });
        }
      };
    }

    function doc(path) {
      var idx = path.lastIndexOf("/");
      var table = path.slice(0, idx), id = path.slice(idx + 1);
      return {
        id: id,
        update: function (data) {
          return idbGet(table, id).then(function (existing) {
            return idbPut(table, Object.assign({ id: id }, existing || {}, data));
          }).then(function () {
            return idbAddOutbox({ table: table, op: "update", id: id, data: data, ts: Date.now() });
          }).then(function () { return loadLocalThenEmit(table); })
            .then(function () { updatePendingBadge(); trySyncOutbox(); });
        },
        delete: function () {
          return idbDelete(table, id)
            .then(function () { return idbAddOutbox({ table: table, op: "delete", id: id, ts: Date.now() }); })
            .then(function () { return loadLocalThenEmit(table); })
            .then(function () { updatePendingBadge(); trySyncOutbox(); });
        }
      };
    }

    return { collection: collection, doc: doc };
  }

  /* ---------------- root render ---------------- */
  function render() {
    applyTheme();
    var app = $("#app");
    if (!currentUser) { app.innerHTML = ""; app.appendChild(renderLogin()); syncKonfiguratorFrame(); return; }
    app.innerHTML = "";
    app.appendChild(renderShell());
    renderPrintArea();
    renderSigFullscreen();
    syncKonfiguratorFrame();
  }

  /* Positioniert/zeigt das Konfigurator-iframe passend zur aktuellen Kopfzeile/Seitennav.
     Das iframe liegt AUSSERHALB von #app und wird hier nur verschoben/skaliert, nie neu
     erzeugt — so bleibt sein Inhalt (offene Eingaben im Konfigurator) beim Tab-Wechsel
     und bei Datenänderungen in anderen Tabs erhalten. */
  function syncKonfiguratorFrame() {
    var frame = $("#konfigurator-frame");
    if (!frame) return;
    var show = !!currentUser && currentTab === "konfigurator";
    frame.style.display = show ? "block" : "none";
    if (!show) return;
    var topbar = $(".topbar");
    var sidenav = $(".sidenav");
    var bottomnav = $(".bottomnav");
    var top = topbar ? topbar.getBoundingClientRect().bottom : 0;
    var left = (sidenav && getComputedStyle(sidenav).display !== "none") ? sidenav.getBoundingClientRect().width : 0;
    var bottom = (bottomnav && getComputedStyle(bottomnav).display !== "none") ? bottomnav.getBoundingClientRect().height : 0;
    frame.style.top = top + "px";
    frame.style.left = left + "px";
    frame.style.right = "0px";
    frame.style.bottom = bottom + "px";
    // Ein <iframe> ist ein "replaced element" — bei position:fixed reicht das Setzen von
    // top/left/right/bottom allein NICHT aus, um es zu strecken (anders als bei normalen
    // <div>s); Breite/Höhe müssen zusätzlich explizit in Pixel berechnet werden.
    frame.style.width = Math.max(0, window.innerWidth - left) + "px";
    frame.style.height = Math.max(0, window.innerHeight - top - bottom) + "px";
  }

  /* ---------------- login / switch user ---------------- */
  // Jede Person im Team hat ein eigenes Passwort (Feld "passwordHash" auf dem team-Datensatz,
  // per sha256Hex gehasht — dasselbe Verfahren wie beim Chef-Passwort, aber ein komplett
  // eigenständiger Wert). Das Chef-Passwort in "settings" (siehe renderPasswordSettingsCard /
  // openSettingsGate) bleibt davon unberührt — es schützt weiterhin ausschließlich die
  // Einstellungen und wird hier nirgends gelesen oder verändert.
  function renderLogin() {
    var wrap = el("div", { class: "login-screen" });
    var card = el("div", { class: "login-card" });
    card.appendChild(el("img", { class: "logo", src: getLogoFull(), alt: "TH Sonnenschutz" }));

    if (loginPickTarget) {
      card.appendChild(renderLoginPasswordStep());
      wrap.appendChild(card);
      return wrap;
    }

    card.appendChild(el("h1", {}, ["Wer bist du?"]));
    card.appendChild(el("p", {}, ["Wähle deinen Namen und gib dein Passwort ein."]));

    var list = el("div", { class: "team-list" });
    if (dbStatus === "connecting" && !loaded.team) {
      list.appendChild(el("p", { style: "color:var(--muted);font-size:13px;" }, ["Lädt …"]));
    } else if (state.team.length === 0) {
      list.appendChild(el("p", { style: "color:var(--muted);font-size:13px;" }, ["Noch niemand angelegt — füge dich unten hinzu."]));
    } else {
      state.team.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "de"); }).forEach(function (m) {
        var btn = el("button", { class: "team-pick", onclick: function () { pickPerson(m); } }, [
          el("span", { class: "avatar" }, [initials(m.name)]),
          el("span", {}, [m.name]),
          !m.passwordHash ? el("span", { style: "font-size:11px;color:var(--warn,#b8860b);margin-left:4px;" }, ["(kein Passwort)"]) : null,
        ]);
        var rm = el("button", { class: "remove", title: "Entfernen", onclick: function (ev) { ev.stopPropagation(); removeTeamMember(m); } }, []);
        rm.innerHTML = icon("x", 15);
        btn.appendChild(rm);
        list.appendChild(btn);
      });
    }
    card.appendChild(list);

    var addRow = el("div", { class: "add-person-row", style: "flex-direction:column;align-items:stretch;gap:8px;" });
    addRow.appendChild(el("p", { style: "margin:6px 0 0;font-size:12px;color:var(--muted);text-align:left;" }, ["Neu hier? Trag deinen Namen und ein eigenes Passwort ein."]));
    var input = el("input", { placeholder: "Eigener Name …", type: "text" });
    var pw1 = el("input", { placeholder: "Passwort (mind. 4 Zeichen) …", type: "password" });
    var pw2 = el("input", { placeholder: "Passwort bestätigen …", type: "password" });
    var addErr = el("p", { style: "margin:0;font-size:12px;color:var(--danger);text-align:left;" }, []);
    function addPerson() {
      var name = input.value.trim();
      var v1 = pw1.value, v2 = pw2.value;
      addErr.textContent = "";
      if (!name) { input.focus(); return; }
      var exists = state.team.some(function (m) { return (m.name || "").toLowerCase() === name.toLowerCase(); });
      if (exists) { addErr.textContent = "Diesen Namen gibt es schon — wähle ihn oben aus der Liste."; return; }
      if (!v1 || v1.length < 4) { addErr.textContent = "Bitte ein Passwort mit mindestens 4 Zeichen vergeben."; return; }
      if (v1 !== v2) { addErr.textContent = "Die Passwörter stimmen nicht überein."; return; }
      if (!db) { addErr.textContent = "Keine Verbindung zur Datenbank."; return; }
      sha256Hex(v1).then(function (hash) {
        db.collection("team").add({ name: name, createdAt: new Date().toISOString(), passwordHash: hash }).then(function () {
          loginAs(name);
        }).catch(function () { addErr.textContent = "Anlegen nicht möglich."; render(); });
      });
    }
    [input, pw1, pw2].forEach(function (f) { f.addEventListener("keydown", function (e) { if (e.key === "Enter") { addPerson(); } }); });
    var addBtn = el("button", { class: "btn btn-primary" }, ["Loslegen"]);
    addBtn.addEventListener("click", addPerson);
    addRow.appendChild(input);

  function pickPerson(m) {
    loginPickTarget = m;
    loginPwError = false;
    loginNewPwMode = !m.passwordHash;
    render();
  }

  function renderLoginPasswordStep() {
    var m = loginPickTarget;
    var box = el("div", { style: "display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;" });
    box.appendChild(el("span", { class: "avatar", style: "width:44px;height:44px;font-size:16px;" }, [initials(m.name)]));
    box.appendChild(el("h1", { style: "font-size:19px;" }, [m.name]));
    box.appendChild(el("p", {}, [loginNewPwMode ? "Für dich ist noch kein Passwort vergeben — leg jetzt eins fest." : "Bitte gib dein Passwort ein."]));

    var pw1 = el("input", { type: "password", placeholder: loginNewPwMode ? "Neues Passwort (mind. 4 Zeichen) …" : "Passwort …", autofocus: "autofocus", style: "width:100%;" });
    var pw2 = loginNewPwMode ? el("input", { type: "password", placeholder: "Passwort bestätigen …", style: "width:100%;" }) : null;
    var err = el("p", { style: "margin:0;font-size:12.5px;color:var(--danger);" }, [loginPwError ? "Falsches Passwort." : ""]);

    function submit() {
      if (loginNewPwMode) {
        var v1 = pw1.value, v2 = pw2.value;
        if (!v1 || v1.length < 4) { loginPwError = false; err.textContent = "Bitte mindestens 4 Zeichen verwenden."; return; }
        if (v1 !== v2) { err.textContent = "Die Passwörter stimmen nicht überein."; return; }
        if (!db) { err.textContent = "Keine Verbindung zur Datenbank."; return; }
        sha256Hex(v1).then(function (hash) {
          db.doc("team/" + m.id).update({ passwordHash: hash }).then(function () {
            loginPickTarget = null;
            loginAs(m.name);
          }).catch(function () { err.textContent = "Speichern nicht möglich."; render(); });
        });
      } else {
        var v = pw1.value;
        if (!v) return;
        sha256Hex(v).then(function (hash) {
          if (hash === m.passwordHash) {
            loginPickTarget = null;
            loginAs(m.name);
          } else {
            loginPwError = true;
            render();
          }
        });
      }
    }
    pw1.addEventListener("keydown", function (e) { if (e.key === "Enter") { if (loginNewPwMode) pw2.focus(); else submit(); } });
    if (pw2) pw2.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

    box.appendChild(pw1);
    if (pw2) box.appendChild(pw2);
    box.appendChild(err);

    var actions = el("div", { style: "display:flex;gap:8px;width:100%;" });
    var backBtn = el("button", { class: "btn", style: "flex:1;" }, ["← Zurück"]);
    backBtn.addEventListener("click", function () { loginPickTarget = null; render(); });
    var okBtn = el("button", { class: "btn btn-primary", style: "flex:1;" }, [loginNewPwMode ? "Passwort speichern" : "Anmelden"]);
    okBtn.addEventListener("click", submit);
    actions.appendChild(backBtn);
    actions.appendChild(okBtn);
    box.appendChild(actions);

    setTimeout(function () { pw1.focus(); }, 30);
    return box;
  }

          // Uhrzeit von einem vorher bearbeiteten Auftrag stehen, obwohl man einen neuen

          // nichts zurückgesetzt, damit man laufende Eingaben nicht versehentlich verwirft.

  function fmtRange(a, b) {
    var sameMonth = a.getMonth() === b.getMonth();
    var left = a.getDate() + ".";
    if (!sameMonth) left += " " + MONTHS[a.getMonth()];
    return left + " – " + b.getDate() + ". " + MONTHS[b.getMonth()] + " " + b.getFullYear();
  }

  function renderDayCard(date) {
    var iso = isoDate(date);
    var isToday = iso === todayIso();
    var card = el("div", { class: "card day-card" + (isToday ? " today" : "") });
    card.appendChild(el("div", { class: "day-head" }, [
      el("span", { class: "wd" }, [WEEKDAYS[(date.getDay() + 6) % 7]]),
      el("span", { class: "dd" }, [date.getDate() + "." + (date.getMonth() + 1) + "."])
    ]));

    var dayAssignments = state.assignments
      .filter(function (a) { return a.date === iso; })
      .sort(function (a, b) { return (a.employeeName || "").localeCompare(b.employeeName || "", "de"); });

    if (dayAssignments.length === 0) {
      card.appendChild(el("p", { style: "font-size:12px;color:var(--muted);margin:0;" }, ["Keine Einteilung"]));
    }
    dayAssignments.forEach(function (a) {
      if (planningEditId === a.id) { card.appendChild(renderAssignForm(iso, a)); return; }
      var item = el("div", { class: "assign-item" });
      item.appendChild(el("div", { class: "who" }, [el("span", { class: "dot" }), a.employeeName || "?"]));
      item.appendChild(el("div", { class: "what" }, [a.site || "(keine Baustelle angegeben)"]));
      if (a.note) item.appendChild(el("div", { class: "note" }, [a.note]));
      if (a.reportId) {
        var linkNote = el("div", { class: "note", style: "cursor:pointer;text-decoration:underline;" }, ["🔗 Auftrag im Archiv öffnen"]);
        linkNote.addEventListener("click", function () {
          var rep = state.reports.find(function (r) { return r.id === a.reportId; });
          if (rep) { currentTab = "archive"; archiveOpenReport = rep; openReportModal(rep); render(); }
        });
        item.appendChild(linkNote);
      }
      var actions = el("div", { class: "actions" });
      var editBtn = el("button", { title: "Bearbeiten", onclick: function () { planningEditId = a.id; planningOpenDate = null; render(); } }, []);
      editBtn.innerHTML = icon("edit", 14);
      var delBtn = el("button", { title: "Löschen", onclick: function () { deleteAssignment(a); } }, []);
      delBtn.innerHTML = icon("trash", 14);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      item.appendChild(actions);
      card.appendChild(item);
    });

    // "+ Zuweisen" führt direkt ins Archiv, wo ein bestehender Auftrag ausgewählt und diesem
    // Tag zugewiesen wird — Zuweisungen entstehen dadurch immer aus einem echten Auftrag

    var addBtn = el("button", { class: "add-assign-btn" }, ["+ Zuweisen"]);
    addBtn.addEventListener("click", function () {
      archivePicker = { date: iso, employeeName: "" };
      planningEditId = null;
      currentTab = "archive";
      render();
    });
    card.appendChild(addBtn);
    return card;
  }

  function renderAssignForm(iso, existing) {
    var form = el("div", { class: "assign-form" });

    var empSelect = el("select", {});

    var names = state.team.map(function (m) { return m.name; });
    if (currentUser && names.indexOf(currentUser) === -1) names.push(currentUser);
    names.sort(function (a, b) { return a.localeCompare(b, "de"); });
    names.forEach(function (n) {
      var opt = el("option", { value: n }, [n]);
      if (existing && existing.employeeName === n) opt.setAttribute("selected", "selected");
      empSelect.appendChild(opt);
    });
    empField.appendChild(empSelect);
    form.appendChild(empField);

    var siteField = el("div", { class: "field" }, [el("label", {}, ["Baustelle / Auftrag (optional)"])]);
    var siteInput = el("input", { type: "text", placeholder: "z. B. Fam. Gruber, Terrassenmarkise", value: existing ? (existing.site || "") : "" });
    siteField.appendChild(siteInput);
    form.appendChild(siteField);

    var noteField = el("div", { class: "field" }, [el("label", {}, ["Notiz (optional)"])]);
    var noteInput = el("input", { type: "text", placeholder: "z. B. Uhrzeit, Hinweise", value: existing ? (existing.note || "") : "" });
    noteField.appendChild(noteInput);

    var rowActions = el("div", { class: "row-actions" });
    var cancelBtn = el("button", { class: "btn btn-sm" }, ["Abbrechen"]);
    cancelBtn.addEventListener("click", function () { planningOpenDate = null; planningEditId = null; render(); });
    var saveBtn = el("button", { class: "btn btn-sm btn-primary" }, [existing ? "Speichern" : "Zuweisen"]);
    saveBtn.addEventListener("click", function () {
      var emp = empSelect.value.trim();
      var site = siteInput.value.trim();
      if (!emp) { empSelect.focus(); return; }
      var payload = { date: iso, employeeName: emp, site: site, note: noteInput.value.trim() };
      if (existing) updateAssignment(existing, payload);
      else addAssignment(payload);
    });
    rowActions.appendChild(cancelBtn);
    rowActions.appendChild(saveBtn);
    form.appendChild(rowActions);
    return form;
  }

  function addAssignment(payload) {
    if (!db) { alert("Keine Verbindung zur Datenbank."); return; }
    payload.createdAt = new Date().toISOString();
    db.collection("assignments").add(payload).then(function () {
      planningOpenDate = null; render();

  function updateAssignment(existing, payload) {
    if (!db) { alert("Keine Verbindung zur Datenbank."); return; }
    db.doc("assignments/" + existing.id).update(payload).then(function () {
      planningEditId = null; render();

  // Lädt die (kostenlose, weit verbreitete) SheetJS-Bibliothek einmalig von einem CDN nach —
  // wird sowohl für den Excel-Export als auch für den Datei-Import (CSV/Excel, z. B. aus sevDesk)
  // gebraucht. Ohne Internetverbindung schlägt das einmalige Nachladen fehl; alles andere in der
  // App funktioniert davon unabhängig weiter.
  function withXlsxLib(cb) {
    if (window.XLSX) { cb(); return; }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = function () { cb(); };
    s.onerror = function () { alert("Dafür ist einmalig eine Internetverbindung nötig (zum Laden der Excel-Funktion)."); };
    document.head.appendChild(s);
  }

  function exportCustomersPdf(list) {
    var rows = list.map(function (c) {
      return "<tr>" +
        "<td>" + escapeHtml(c.name || "") + (c.isBusiness ? ' <span style="color:#8A8F98;font-size:10.5px;">(Geschäftskunde)</span>' : "") + "</td>" +
        "<td>" + escapeHtml([c.street, c.city].filter(Boolean).join(", ")) + "</td>" +
        "<td>" + escapeHtml(c.phone || "") + "</td>" +
        "<td>" + escapeHtml(c.email || "") + "</td>" +
        "<td>" + escapeHtml(c.isBusiness ? (c.uid || "") : "") + "</td>" +
        "</tr>";
    }).join("");
    var heute = new Date().toLocaleDateString("de-AT");
    var html = '<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Kundenliste — TH Sonnenschutz</title><style>' +
      "body{font-family:Arial,sans-serif;padding:28px;color:#1B1F24;margin:0;}" +
      ".kopf{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1B1F24;padding-bottom:14px;margin-bottom:6px;}" +
      ".kopf img{width:46px;height:46px;}" +
      ".firma{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#4f7691;font-weight:600;}" +
      ".titel{font-size:20px;font-weight:700;}" +

  /* -------- Import: Kunden aus einer CSV/Excel-Datei (z. B. Export aus sevDesk) -------- */
  // Erkennt gängige Spaltennamen (deutsch/englisch, verschiedene Schreibweisen) automatisch.
  // Falls die Zuordnung bei einer bestimmten Datei nicht passt, kann die Spaltenerkennung anhand
  // eines Beispiel-Exports gezielt nachgeschärft werden.
  var CUSTOMER_IMPORT_COLUMN_SYNONYMS = {
    name: ["name", "firma", "firmenname", "kunde", "kundenname", "auftraggeber", "company", "unternehmen"],
    street: ["straße", "strasse", "adresse", "street", "anschrift"],
    plz: ["plz", "postleitzahl", "zip", "zipcode", "postal code"],
    ort: ["ort", "stadt", "city", "location"],
    ortPlzCombined: ["ort/plz", "ort / plz", "plz/ort", "plz / ort"],
    phone: ["telefon", "telefonnummer", "tel", "phone", "mobil", "handy", "telefon 1"],
    email: ["email", "e-mail", "mail", "e-mail-adresse"],
    uid: ["uid", "uid-nr", "uid nr", "ustid", "ust-id", "ust-idnr", "umsatzsteuer-id", "umsatzsteuer-idnr", "vat", "vat id"]
  };
  function normalizeHeader(h) {
    return String(h || "").trim().toLowerCase().replace(/\.+$/, "").replace(/\s+/g, " ");
  }
  function buildColumnMap(headerRow) {
    var map = {};
    headerRow.forEach(function (h) {
      var norm = normalizeHeader(h);
      Object.keys(CUSTOMER_IMPORT_COLUMN_SYNONYMS).forEach(function (field) {
        if (map[field]) return;
        if (CUSTOMER_IMPORT_COLUMN_SYNONYMS[field].indexOf(norm) !== -1) map[field] = h;
      });
    });
    return map;
  }
  function importCustomersButton() {
    var btn = el("button", { class: "btn btn-sm" }, []);
    btn.innerHTML = icon("upload", 15) + "<span>Kunden importieren</span>";
    var fileInput = el("input", { type: "file", accept: ".csv,.xlsx,.xls", style: "display:none;" });
    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      btn.disabled = true;
      withXlsxLib(function () {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var wb;
            if (/\.csv$/i.test(file.name)) {
              wb = window.XLSX.read(reader.result, { type: "string" });
            } else {
              wb = window.XLSX.read(reader.result, { type: "array" });
            }
            var sheet = wb.Sheets[wb.SheetNames[0]];
            var rows = window.XLSX.utils.sheet_to_json(sheet, { defval: "" });
            if (!rows.length) { alert("Die Datei enthält keine Zeilen."); btn.disabled = false; return; }
            var colMap = buildColumnMap(Object.keys(rows[0]));
            if (!colMap.name) { alert("Konnte keine Namens-Spalte in der Datei erkennen. Bitte eine Datei mit einer Spalte \"Name\" oder \"Firma\" verwenden, oder eine Beispieldatei zur Prüfung schicken."); btn.disabled = false; return; }
            var existingNames = {};
            state.customers.forEach(function (c) { existingNames[(c.name || "").trim().toLowerCase()] = true; });
            var toCreate = [];
            var skippedNoName = 0, skippedDuplicate = 0;
            rows.forEach(function (row) {
              var name = String(row[colMap.name] || "").trim();
              if (!name) { skippedNoName++; return; }
              if (existingNames[name.toLowerCase()]) { skippedDuplicate++; return; }
              existingNames[name.toLowerCase()] = true; // gleich benannte Zeilen innerhalb derselben Datei nicht doppelt anlegen
              var street = colMap.street ? String(row[colMap.street] || "").trim() : "";
              var city = "";
              if (colMap.plz || colMap.ort) {
                city = [colMap.plz ? String(row[colMap.plz] || "").trim() : "", colMap.ort ? String(row[colMap.ort] || "").trim() : ""].filter(Boolean).join(" ");
              } else if (colMap.ortPlzCombined) {
                city = String(row[colMap.ortPlzCombined] || "").trim();
              }
              var uid = colMap.uid ? String(row[colMap.uid] || "").trim() : "";
              toCreate.push({
                name: name,
                street: street,
                city: city,
                phone: colMap.phone ? String(row[colMap.phone] || "").trim() : "",
                email: colMap.email ? String(row[colMap.email] || "").trim() : "",
                isBusiness: !!uid,
                uid: uid,
                createdAt: new Date().toISOString()
              });
            });
            if (!toCreate.length) {
              alert("Keine neuen Kunden zum Anlegen gefunden (" + skippedDuplicate + " bereits vorhanden, " + skippedNoName + " ohne Namen übersprungen).");
              btn.disabled = false;
              return;
            }
            if (!db) { alert("Keine Verbindung zur Datenbank."); btn.disabled = false; return; }
            // Nacheinander anlegen (nicht alle gleichzeitig), um die Datenbank nicht mit vielen
            // Anfragen auf einmal zu überlasten.
            var i = 0;
            function next() {
              if (i >= toCreate.length) {
                btn.disabled = false;
                fileInput.value = "";
                alert(toCreate.length + " Kunde" + (toCreate.length === 1 ? "" : "n") + " importiert." + (skippedDuplicate ? " " + skippedDuplicate + " bereits vorhanden übersprungen." : "") + (skippedNoName ? " " + skippedNoName + " ohne Namen übersprungen." : ""));
                render();
                return;
              }
              db.collection("customers").add(toCreate[i]).then(function () { i++; next(); }).catch(function () { i++; next(); });
            }
            next();
          } catch (err) {
            alert("Datei konnte nicht gelesen werden. Bitte als CSV oder Excel (.xlsx) exportieren.");
            btn.disabled = false;
          }
        };
        if (/\.csv$/i.test(file.name)) reader.readAsText(file, "UTF-8");
        else reader.readAsArrayBuffer(file);
      });
    });
    btn.addEventListener("click", function () { fileInput.click(); });
    var wrap = el("div", {}, [btn, fileInput]);
    return wrap;
  }

  // Zerlegt einen bisher als EIN Feld gespeicherten "PLZ Ort"-Text (z. B. "4770 Andorf")
  // wieder in seine zwei Bestandteile, damit bestehende Adressen beim Bearbeiten weiterhin
  // korrekt in den getrennten PLZ-/Ort-Feldern erscheinen.
  function splitPlzOrt(combined) {
    var s = (combined || "").trim();
    var m = /^(\d{4})\s*(.*)$/.exec(s);
    if (m) return { plz: m[1], ort: m[2] };
    return { plz: "", ort: s };
  }

  // Fragt bei einer 4-stelligen PLZ die zugehörigen Orte ab und ruft cb(namen) mit einer Liste
  // aller zur PLZ passenden Ortsnamen auf (kann auch mehrere sein — in Österreich teilen sich
  // oft mehrere Ortschaften dieselbe PLZ, z. B. kleinere Gemeindeteile). cb([]) bedeutet: kein
  // Treffer, der Ort kann wie bisher von Hand eingetragen werden.
  //
  // Primärquelle ist die OpenPLZ-API (openplzapi.org, offene Verwaltungsdaten von Statistik
  // Austria) — die liefert alle Orte zu einer PLZ statt nur eines einzelnen (oft falschen)
  // Treffers. Zippopotam dient nur noch als Ausweich-Quelle, falls OpenPLZ einmal nicht
  // erreichbar ist.
  var __plzLookupTimer = null;
  function autoFillOrtFromPlz(plz, cb) {
    clearTimeout(__plzLookupTimer);
    var digits = (plz || "").trim();
    if (!/^\d{4}$/.test(digits)) return;
    __plzLookupTimer = setTimeout(function () {
      if (typeof navigator !== "undefined" && "onLine" in navigator && !navigator.onLine) return;
      fetch("https://openplzapi.org/at/Localities?postalCode=" + digits, { headers: { Accept: "application/json" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (list) {
          var namen = (list || []).map(function (o) { return o && o.name; }).filter(Boolean);
          namen = namen.filter(function (n, i) { return namen.indexOf(n) === i; }); // Duplikate raus
          if (namen.length > 0) { cb(namen); return; }
          // Ausweich-Quelle, falls OpenPLZ nichts liefert (z. B. Ausfall)
          return fetch("https://api.zippopotam.us/at/" + digits).then(function (r2) { return r2.ok ? r2.json() : null; }).then(function (data) {
            if (data && data.places && data.places[0] && data.places[0]["place name"]) cb([data.places[0]["place name"]]);
            else cb([]);
          });
        })
        .catch(function () {
          fetch("https://api.zippopotam.us/at/" + digits).then(function (r2) { return r2.ok ? r2.json() : null; }).then(function (data) {
            if (data && data.places && data.places[0] && data.places[0]["place name"]) cb([data.places[0]["place name"]]);
          }).catch(function () {});
        });
    }, 400);
  }

  // Baut eine PLZ-/Ort-Feldzeile, die beide Werte laufend zu EINEM kombinierten String im
  // Entwurfsobjekt zusammenführt (combinedKey) — so bleibt die Datenbank-Spalte unverändert
  // (weiterhin ein einziges Textfeld "4770 Andorf"), während die Eingabe für den Benutzer in
  // zwei getrennte, übersichtliche Felder aufgeteilt ist. Beim Eintippen der PLZ wird der Ort
  // automatisch vorgeschlagen (aber nur, wenn das Ort-Feld noch leer ist — eine bereits von
  // Hand eingetragene Ortsbezeichnung wird nie überschrieben). Gibt es zu einer PLZ mehrere
  // Orte (in Österreich keine Seltenheit), wird NICHT blind einer davon eingetragen — stattdessen
  // erscheinen alle Treffer als Auswahlliste unter dem Ort-Feld, damit der richtige Ort per Klick
  // gewählt werden kann statt automatisch (und ggf. falsch) geraten zu werden.
  function plzOrtFieldRow(draftObj, combinedKey, plzKey, ortKey) {
    if (draftObj[plzKey] === undefined || draftObj[ortKey] === undefined) {
      var parsed = splitPlzOrt(draftObj[combinedKey]);
      draftObj[plzKey] = parsed.plz;
      draftObj[ortKey] = parsed.ort;
    }
    function recombine() {
      draftObj[combinedKey] = (draftObj[plzKey] || "").trim() + ((draftObj[plzKey] && draftObj[ortKey]) ? " " : "") + (draftObj[ortKey] || "").trim();
    }
    var wrap = el("div", { class: "field-row cols-2" });
    var plzField = fieldInput("PLZ", plzKey, draftObj[plzKey], "4770");
    plzField.input.setAttribute("inputmode", "numeric");
    plzField.input.setAttribute("maxlength", "4");
    var ortField = fieldInput("Ort", ortKey, draftObj[ortKey], "Andorf");
    var ortHint = el("p", { style: "margin:2px 0 0;font-size:11px;color:var(--muted);" }, []);
    var datalistId = uid();
    var datalist = el("datalist", { id: datalistId }, []);
    ortField.input.setAttribute("list", datalistId);
    ortField.wrap.appendChild(datalist);
    ortField.wrap.appendChild(ortHint);
    plzField.input.addEventListener("input", function (e) {
      draftObj[plzKey] = e.target.value;
      recombine();
      datalist.innerHTML = "";
      ortHint.textContent = "";
      autoFillOrtFromPlz(draftObj[plzKey], function (namen) {
        if (!namen || namen.length === 0) return;
        namen.forEach(function (n) { datalist.appendChild(el("option", { value: n }, [])); });
        if (namen.length === 1) {
          if (!draftObj[ortKey]) {
            draftObj[ortKey] = namen[0];
            ortField.input.value = namen[0];
            recombine();
          }
        } else {
          ortHint.textContent = "Mehrere Orte zu dieser PLZ — bitte im Feld „Ort“ auswählen: " + namen.join(", ");
        }
      });
    });
    ortField.input.addEventListener("input", function (e) { draftObj[ortKey] = e.target.value; recombine(); });
    wrap.appendChild(plzField.wrap);
    wrap.appendChild(ortField.wrap);
    return wrap;
  }

  /* =====================================================================
     Stunden (Zeiterfassung) — jeder Mitarbeiter trägt seine geleisteten
     Stunden manuell ein (Beginn/Ende/Pause); Auswertung nach Monat/Mitarbeiter.
     ===================================================================== */
  function computeHoursDuration(h) {
    if (!h || !h.start || !h.ende) return 0;
    var sp = String(h.start).split(":"), ep = String(h.ende).split(":");
    if (sp.length < 2 || ep.length < 2) return 0;
    var startMin = parseInt(sp[0], 10) * 60 + parseInt(sp[1], 10);
    var endMin = parseInt(ep[0], 10) * 60 + parseInt(ep[1], 10);
    var diff = endMin - startMin;
    if (diff < 0) diff += 24 * 60; // falls über Mitternacht (selten)
    diff -= (h.breakMinutes || 0);
    if (diff < 0) diff = 0;
    return diff / 60;
  }

  function renderHours() {
    var view = el("div", { class: "view" });
    var addBtn = el("button", { class: "btn btn-primary btn-sm" }, []);
    addBtn.innerHTML = icon("plus", 15) + "<span>Erfassen</span>";
    addBtn.addEventListener("click", function () {

      render();
    });
    view.appendChild(el("div", { class: "view-head" }, [
      el("div", {}, [
        el("h1", {}, ["Stunden"]),
        el("p", {}, ["Arbeitszeiten erfassen und je Monat auswerten."])
      ]),
      addBtn
    ]));

    if (hoursEditing) view.appendChild(renderHoursEditor());

    var filterRow = el("div", { class: "field-row cols-2" });
    var monthField = el("div", { class: "field" }, [el("label", {}, ["Monat"])]);
    var monthInput = el("input", { type: "month", value: hoursMonth });
    monthInput.addEventListener("change", function (e) { hoursMonth = e.target.value || hoursMonth; render(); });
    monthField.appendChild(monthInput);
    filterRow.appendChild(monthField);

    var empField = el("div", { class: "field" }, [el("label", {}, ["Mitarbeiter"])]);
    var empSelect = el("select", {});
    empSelect.appendChild(el("option", { value: "" }, ["Alle"]));
    state.team.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "de"); }).forEach(function (m) {
      var opt = el("option", { value: m.name }, [m.name]);
      if (hoursEmployeeFilter === m.name) opt.setAttribute("selected", "selected");
      empSelect.appendChild(opt);
    });
    empSelect.addEventListener("change", function (e) { hoursEmployeeFilter = e.target.value; render(); });
    empField.appendChild(empSelect);
    filterRow.appendChild(empField);
    view.appendChild(filterRow);

    var filtered = state.hours.filter(function (h) {
      if ((h.date || "").slice(0, 7) !== hoursMonth) return false;
      if (hoursEmployeeFilter && h.employeeName !== hoursEmployeeFilter) return false;
      return true;
    }).sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });

    if (!loaded.hours) {
      view.appendChild(el("p", { style: "color:var(--muted);" }, ["Lädt …"]));
    } else if (filtered.length === 0) {
      view.appendChild(emptyState("clock", "Keine Einträge", "Für diesen Monat wurden noch keine Arbeitsstunden erfasst."));
    } else {
      var list = el("div", { class: "customer-list" });
      var total = 0;
      filtered.forEach(function (h) {
        total += computeHoursDuration(h);
        list.appendChild(renderHoursRow(h));
      });
      view.appendChild(list);

      var printBtn = el("button", { class: "btn btn-sm" }, []);
      printBtn.innerHTML = icon("printer", 14) + "<span>Drucken</span>";

        el("span", { style: "font-weight:600;" }, ["Summe " + (hoursEmployeeFilter || "alle Mitarbeiter") + ": " + total.toFixed(2) + " Std."]),
        printBtn
      ]);
      view.appendChild(summary);
    }
    return view;
  }

      var payload = {
        date: dateInput.value || todayIso(),
        employeeName: emp,
        site: siteInput.value.trim(),
        start: startInput.value,
        ende: endInput.value,

  function buildHoursPrintHtml(title, rows) {
    var html = "";
    html += '<div class="p-header"><div class="company">' + escapeHtml(COMPANY.name) + " | " + escapeHtml(COMPANY.street) + " | " + escapeHtml(COMPANY.city) +
      "<br>Tel.: " + escapeHtml(COMPANY.tel) + " · Handy: " + escapeHtml(COMPANY.mobile) + "<br>" + escapeHtml(COMPANY.mail) + '</div><img src="' + getLogoFull() + '"></div>';
    html += '<h2 style="margin:10px 0;">' + escapeHtml(title) + "</h2>";
    html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    html += '<thead><tr style="text-align:left;border-bottom:1.5px solid #000;">' +
      '<th style="padding:4px 6px;">Datum</th><th style="padding:4px 6px;">Mitarbeiter</th><th style="padding:4px 6px;">Baustelle</th>' +
      '<th style="padding:4px 6px;">Beginn</th><th style="padding:4px 6px;">Ende</th><th style="padding:4px 6px;">Pause</th>' +
      '<th style="padding:4px 6px;">Stunden</th><th style="padding:4px 6px;">Notiz</th></tr></thead><tbody>';
    var total = 0;
    (rows || []).forEach(function (h) {
      var dur = computeHoursDuration(h);
      total += dur;
      html += '<tr style="border-bottom:1px solid #ccc;">' +
        '<td style="padding:4px 6px;">' + escapeHtml(deDateFromIso(h.date)) + "</td>" +
        '<td style="padding:4px 6px;">' + escapeHtml(h.employeeName) + "</td>" +
        '<td style="padding:4px 6px;">' + escapeHtml(h.site) + "</td>" +
        '<td style="padding:4px 6px;">' + escapeHtml(h.start) + "</td>" +
        '<td style="padding:4px 6px;">' + escapeHtml(h.ende) + "</td>" +
        '<td style="padding:4px 6px;">' + (h.breakMinutes || 0) + " Min.</td>" +
        '<td style="padding:4px 6px;">' + dur.toFixed(2) + "</td>" +
        '<td style="padding:4px 6px;">' + escapeHtml(h.note) + "</td></tr>";
    });
    html += "</tbody></table>";
    html += '<p style="margin-top:12px;font-weight:700;">Summe: ' + total.toFixed(2) + " Stunden</p>";
    return html;
  }

  // Vollbild-Unterschrift: derselbe Signatur-Pad-Mechanismus, nur mit deutlich mehr Platz —
  // v.a. auf dem Handy ist die kleine Fläche im Formular zum Unterschreiben oft zu knapp.
  function renderSigFullscreen() {
    var root = $("#sig-fullscreen-root");
    if (!root) return;
    if (!sigFullscreenKey) { root.innerHTML = ""; return; }
    var key = sigFullscreenKey;
    var title = key === "kunde" ? "Unterschrift Kunde" : "Unterschrift Monteur";

    wrap.appendChild(canvas);

    var actionsRow = el("div", { class: "sig-actions sig-fullscreen-actions" });
    var status = el("span", { style: "font-size:12.5px;color:var(--muted);" }, [reportSig[key] ? "✓ Unterschrieben" : "Noch keine Unterschrift"]);
    var clearBtn = el("button", { class: "btn btn-sm btn-ghost" }, ["Löschen"]);
    clearBtn.addEventListener("click", function () {
      reportSig[key] = null;
      var ctx = canvas.getContext("2d");

      status.textContent = "Noch keine Unterschrift";

    actionsRow.appendChild(status);
    actionsRow.appendChild(clearBtn);

    root.appendChild(overlay);

  // interactive=false (kleines Feld im Formular): zeichnet nur die vorhandene Unterschrift,
  // hängt aber KEINE Zeichen-Listener an den Canvas — so kann ein Wischen/Scrollen über das
  // kleine Feld die Unterschrift nicht versehentlich verändern. interactive=true (Vollbild):
  // wie bisher voll beschreibbar.
  function attachSignaturePad(canvas, key, placeholder, status, interactive) {
    requestAnimationFrame(function () {
      var ratio = window.devicePixelRatio || 1;
      var cssWidth = canvas.clientWidth || (canvas.parentElement && canvas.parentElement.clientWidth) || 280;
      // Richtet sich nach der tatsächlich gerenderten CSS-Höhe des jeweiligen Canvas — dadurch
      // funktioniert dieselbe Funktion unverändert sowohl für das kleine Unterschriftsfeld
      // (feste Höhe per CSS) als auch für die Vollbild-Variante (füllt den verfügbaren Platz).
      var cssHeight = canvas.clientHeight || 140;
      canvas.width = Math.max(1, Math.round(cssWidth * ratio));
      canvas.height = Math.max(1, Math.round(cssHeight * ratio));
      var ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      var inkColor = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#1c2b38";
      ctx.strokeStyle = inkColor;

      if (reportSig[key]) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, cssWidth, cssHeight); };
        img.src = reportSig[key];
        if (placeholder) placeholder.style.display = "none";
      }

      if (!interactive) return; // kleines Feld: nur Anzeige, kein Zeichnen (siehe Hinweis oben)

      var drawing = false, last = null;
      function pos(e) {
        var r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      function down(e) {
        drawing = true; last = pos(e);
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
        if (placeholder) placeholder.style.display = "none";
        e.preventDefault();
      }
      function move(e) {
        if (!drawing) return;
        var p = pos(e);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
        e.preventDefault();
      }
      function up() {
        if (!drawing) return;
        drawing = false;
        reportSig[key] = canvas.toDataURL("image/png");
        if (status) status.textContent = "✓ Unterschrieben";
      }
      canvas.addEventListener("pointerdown", down);
      canvas.addEventListener("pointermove", move);
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointerleave", up);
      canvas.addEventListener("pointercancel", up);
    });
  }

  // Die eigentlichen Auftragsdaten aus reportDraft, ohne die rein lokalen
  // Editor-Felder (id) — Basis für alle drei Speicher-Aktionen (abschließen /
  // als offen speichern / zurückstellen).
  function draftDataFields() {
    return {
      previousReportId: reportDraft.previousReportId || null,
      type: reportDraft.type,
      customerId: reportDraft.customerId,
      auftraggeber: reportDraft.auftraggeber,

    };
