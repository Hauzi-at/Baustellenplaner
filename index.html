  // Legt einen neuen Bericht an ODER aktualisiert den bestehenden (falls reportDraft.id
  // gesetzt ist, weil ein offener/zurückgestellter Auftrag zum Bearbeiten geöffnet wurde).
  // Ruft cb(reportId) bei Erfolg auf.
  function saveReportRecord(extraFields, cb) {
    if (!db) { alert("Keine Verbindung zur Datenbank — Auftrag kann gerade nicht gespeichert werden."); return; }
    var payload = Object.assign(draftDataFields(), extraFields);
    if (reportDraft.id) {
      db.doc("reports/" + reportDraft.id).update(payload).then(function () { cb(reportDraft.id); })
        .catch(function () { alert("Speichern nicht möglich. Bitte erneut versuchen."); });
    } else {
      payload.createdAt = new Date().toISOString();
      db.collection("reports").add(payload).then(function (ref) { cb(ref.id); })
        .catch(function () { alert("Speichern nicht möglich (evtl. zu groß). Bitte Unterschriften einfacher halten und erneut versuchen."); });
    }
  }

  // Erstellt/aktualisiert bei Bedarf einen verknüpften Eintrag in der Planungs-Kalenderwoche
  // ("assignments"), wenn dem Auftrag Mitarbeiter + Datum zugewiesen wurden — so taucht ein
  // vom Chef eingeteilter Auftrag automatisch in der Planung auf, ohne dass er ihn dort noch
  // einmal separat anlegen muss.
  function syncAssignmentForReport(reportId, data) {
    if (!db) return;
    if (!data.assignedTo || !data.scheduledDate) return;
    var payload = {
      date: data.scheduledDate,
      employeeName: data.assignedTo,
      site: data.baustelle || data.auftraggeber || "",
      note: "Auftrag im Archiv" + (data.pauseNote ? (" – " + data.pauseNote) : ""),
      reportId: reportId
    };
    var existing = state.assignments.find(function (a) { return a.reportId === reportId; });
    if (existing) {
      db.doc("assignments/" + existing.id).update(payload).catch(function () {});
    } else {
      payload.createdAt = new Date().toISOString();
      db.collection("assignments").add(payload).catch(function () {});
    }
  }

  function completeReport() {
    if (!reportDraft.auftraggeber.trim()) { alert("Bitte einen Auftraggeber angeben."); return; }
    if (!reportDraft.beschreibungTaetigkeit.trim()) { alert("Bitte die Beschreibung der Tätigkeit ausfüllen."); return; }
    if (!reportSig.kunde) { alert("Der Kunde muss unterschreiben, bevor der Auftrag abgeschlossen werden kann."); return; }
    if (!db) { alert("Keine Verbindung zur Datenbank — Auftrag kann gerade nicht gespeichert werden."); return; }
    if (!reportDraft.datum) reportDraft.datum = todayDe();
    if (!reportDraft.datumUnterschrift) reportDraft.datumUnterschrift = todayDe();

    saveReportRecord({ status: "abgeschlossen", completedAt: new Date().toISOString() }, function (reportId) {
      syncAssignmentForReport(reportId, draftDataFields());
      startNewReport();
      currentTab = "archive";
      render();
    });
  }

  // "Als offenen Auftrag speichern" — für den Chef, um einen Auftrag anzulegen (und ggf.
  // direkt einem Mitarbeiter + Datum zuzuweisen), ohne dass er sofort vor Ort abgeschlossen
  // und vom Kunden unterschrieben werden muss.
  function saveOpenReport() {
    if (!reportDraft.auftraggeber.trim()) { alert("Bitte einen Auftraggeber angeben."); return; }
    if (!db) { alert("Keine Verbindung zur Datenbank — Auftrag kann gerade nicht gespeichert werden."); return; }
    if (!reportDraft.datum) reportDraft.datum = todayDe();

    saveReportRecord({ status: "offen" }, function (reportId) {
      syncAssignmentForReport(reportId, draftDataFields());
      startNewReport();
      currentTab = "archive";
      render();
    });
  }

  // "Nicht abschließbar …" — Auftrag zurückstellen (gleicher Datensatz, später neu
  // einteilbar) und optional einen verknüpften Folgeauftrag anlegen (z. B. sobald Material
  // da ist), der auf den ursprünglichen Auftrag verweist (previousReportId).
  function pauseReport(createFollowup) {
    if (!reportDraft.auftraggeber.trim()) { alert("Bitte einen Auftraggeber angeben."); return; }
    if (!db) { alert("Keine Verbindung zur Datenbank — Auftrag kann gerade nicht gespeichert werden."); return; }

    saveReportRecord({ status: "zurückgestellt" }, function (reportId) {
      if (!createFollowup) {
        // Zurückgestellt, aber weiterhin derselbe Auftrag — Kalendereintrag (falls
        // Mitarbeiter/Datum gesetzt) bleibt/entsteht, damit er zum Neu-Einteilen sichtbar ist.
        syncAssignmentForReport(reportId, draftDataFields());
        reportPauseUiOpen = false;
        startNewReport();
        currentTab = "archive";
        render();
        return;
      }
      // Folgeauftrag: den alten Kalendereintrag (falls vorhanden) entfernen, damit die
      // Baustelle nicht doppelt in der Planung auftaucht — der neue, verknüpfte Auftrag
      // übernimmt die Einteilung.
      var oldAssignment = state.assignments.find(function (a) { return a.reportId === reportId; });
      if (oldAssignment && db) db.doc("assignments/" + oldAssignment.id).delete().catch(function () {});
      var followupPayload = Object.assign(draftDataFields(), {
        status: "offen",
        previousReportId: reportId,
        pauseNote: "",
        sigKunde: null,
        sigMonteur: null,
        createdAt: new Date().toISOString()
      });
      db.collection("reports").add(followupPayload).then(function (ref) {
        syncAssignmentForReport(ref.id, followupPayload);
        reportPauseUiOpen = false;
        startNewReport();
        currentTab = "archive";
        render();
      }).catch(function () { alert("Folgeauftrag konnte nicht angelegt werden."); });
    });
  }

      el("div", {}, [
        el("h1", {}, ["Auftragsarchiv"]),

      ])
    ]));

    if (archivePicker) view.appendChild(renderArchivePickerBanner());

    var filters = el("div", { class: "archive-filters" });
    var searchInput = el("input", { type: "search", placeholder: "Suche (Kunde, Baustelle) …", value: archiveFilter.q, style: "flex:1;min-width:160px;" });
    searchInput.addEventListener("input", debounce(function (e) { archiveFilter.q = e.target.value; render(); }, 120));
    filters.appendChild(searchInput);

    var statusSel = el("select", {});
    [["", "Alle Status"], ["offen", "Offen"], ["zurückgestellt", "Zurückgestellt"], ["abgeschlossen", "Abgeschlossen"]].forEach(function (pair) {
      var o = el("option", { value: pair[0] }, [pair[1]]);

    });
    statusSel.addEventListener("change", function (e) { archiveFilter.status = e.target.value; render(); });
    filters.appendChild(statusSel);

    var empSel = el("select", {});
    empSel.appendChild(el("option", { value: "" }, ["Alle Mitarbeiter"]));
    var names = Array.from(new Set(state.reports.map(function (r) { return r.monteur; }).filter(Boolean)));
    names.sort(function (a, b) { return a.localeCompare(b, "de"); });
    names.forEach(function (n) { var o = el("option", { value: n }, [n]); if (archiveFilter.employee === n) o.setAttribute("selected", "selected"); empSel.appendChild(o); });
    empSel.addEventListener("change", function (e) { archiveFilter.employee = e.target.value; render(); });
    filters.appendChild(empSel);

    var typeSel = el("select", {});
    typeSel.appendChild(el("option", { value: "" }, ["Alle Typen"]));
    REPORT_TYPES.forEach(function (t) { var o = el("option", { value: t }, [t]); if (archiveFilter.type === t) o.setAttribute("selected", "selected"); typeSel.appendChild(o); });
    typeSel.addEventListener("change", function (e) { archiveFilter.type = e.target.value; render(); });
    filters.appendChild(typeSel);

    view.appendChild(filters);

    var q = archiveFilter.q.trim().toLowerCase();
    var list = state.reports.filter(function (r) {
      if (archiveFilter.employee && r.monteur !== archiveFilter.employee) return false;
      if (archiveFilter.type && r.type !== archiveFilter.type) return false;
      if (archiveFilter.status && (r.status || "abgeschlossen") !== archiveFilter.status) return false;
      if (q && [r.auftraggeber, r.baustelle].filter(Boolean).join(" ").toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });

    if (!loaded.reports) {
      view.appendChild(el("p", { style: "color:var(--muted);" }, ["Lädt …"]));
    } else if (list.length === 0) {
      view.appendChild(emptyState("archive", state.reports.length === 0 ? "Noch keine Aufträge" : "Keine Treffer",

    } else {
      var rows = el("div", { class: "report-list" });
      list.forEach(function (r) { rows.appendChild(renderReportRow(r)); });
      view.appendChild(rows);
    }
    return view;
  }

  function renderReportRow(r) {

  function openReportModal(r) {

  function renderPasswordModal(mode) {
    var root = $("#modal-root");
    root.innerHTML = "";
    var backdrop = el("div", { class: "modal-backdrop" });
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeAnyModal(); });
    var sheet = el("div", { class: "modal-sheet" });

    var head = el("div", { class: "modal-head" });
    head.appendChild(el("h2", {}, [mode === "set" ? "Chef-Passwort festlegen" : "Chef-Bereich"]));
    var closeBtn = el("button", {}, []); closeBtn.innerHTML = icon("x", 20); closeBtn.addEventListener("click", closeAnyModal);
    head.appendChild(closeBtn);
    sheet.appendChild(head);

    var iconWrap = el("div", { style: "display:flex;justify-content:center;color:var(--slate);margin:2px 0 4px;" }, []);
    iconWrap.innerHTML = icon("lock", 30);
    sheet.appendChild(iconWrap);

    var errBox = el("div", { class: "banner", style: "background:var(--danger-bg);color:var(--danger);display:none;" }, ["Falsches Passwort."]);

    if (mode === "set") {
      sheet.appendChild(el("p", { style: "color:var(--muted);font-size:13px;text-align:center;margin:0;" }, ["Noch kein Passwort gesetzt. Lege jetzt eines fest, um die Einstellungen zu schützen (Mitarbeiter-Verwaltung, Farbe, Logo)."]));
      var p1 = fieldInput("Neues Passwort", "p1", "", "");
      p1.input.type = "password";
      var p2 = fieldInput("Passwort bestätigen", "p2", "", "");
      p2.input.type = "password";
      sheet.appendChild(p1.wrap);
      sheet.appendChild(p2.wrap);
      sheet.appendChild(errBox);
      var saveBtn = el("button", { class: "btn btn-primary" }, ["Passwort festlegen & Einstellungen öffnen"]);
      saveBtn.addEventListener("click", function () {
        var v1 = p1.input.value, v2 = p2.input.value;
        if (!v1 || v1.length < 4) { errBox.textContent = "Bitte mindestens 4 Zeichen verwenden."; errBox.style.display = "flex"; return; }
        if (v1 !== v2) { errBox.textContent = "Die Passwörter stimmen nicht überein."; errBox.style.display = "flex"; return; }
        sha256Hex(v1).then(function (hash) {
          if (!db) { errBox.textContent = "Keine Verbindung zur Datenbank."; errBox.style.display = "flex"; return; }
          db.doc("settings/main").update({ passwordHash: hash, updatedAt: new Date().toISOString() }).then(function () {
            settingsUnlocked = true;
            closeAnyModal();
            currentTab = "settings";
            render();
          }).catch(function () { errBox.textContent = "Speichern nicht möglich."; errBox.style.display = "flex"; });
        });
      });
      sheet.appendChild(saveBtn);
    } else {
      var pw = fieldInput("Chef-Passwort", "pw", "", "");
      pw.input.type = "password";
      pw.input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
      sheet.appendChild(pw.wrap);
      sheet.appendChild(errBox);
      var unlockBtn = el("button", { class: "btn btn-primary" }, ["Entsperren"]);
      unlockBtn.addEventListener("click", tryUnlock);
      sheet.appendChild(unlockBtn);
      sheet.appendChild(el("p", { style: "color:var(--muted);font-size:11.5px;text-align:center;margin:0;" }, ['Passwort vergessen? Es kann direkt in der Supabase-Tabelle "settings" zurückgesetzt werden (Feld passwordHash leeren).']));
      function tryUnlock() {
        var v = pw.input.value;
        sha256Hex(v).then(function (hash) {
          if (hash === getSettings().passwordHash) {
            settingsUnlocked = true;
            closeAnyModal();
            currentTab = "settings";
            render();
          } else {
            errBox.style.display = "flex";
            pw.input.value = "";
            pw.input.focus();
          }
        });
      }
    }

    backdrop.appendChild(sheet);
    root.appendChild(backdrop);
  }

  // Sichtbarkeit von "Produktion"/"Kalkulation" im Konfigurator — liegt im selben gemeinsamen
  // kv_store wie die Preisparameter/Positionslisten, damit es EINE einzige Einstellung für die
  // ganze App gibt (früher gab es dafür einen eigenen, separaten Passwortschutz im Konfigurator).
  function loadKonfEinstellungen(cb) {
    var fallback = { produktionSichtbar: true, kalkulationSichtbar: true };
    if (!rawClient) { cb(fallback); return; }
    rawClient.from("kv_store").select("value").eq("key", "app_einstellungen_v1").maybeSingle().then(function (res) {
      var v = fallback;
      if (res && res.data && res.data.value) {
        try { v = Object.assign({}, fallback, JSON.parse(res.data.value)); } catch (e) {}
      }
      cb(v);
    }).catch(function () { cb(fallback); });
  }
  function saveKonfEinstellungen(v) {
    if (!rawClient) return;
    rawClient.from("kv_store").upsert({ key: "app_einstellungen_v1", value: JSON.stringify(v), updatedAt: new Date().toISOString() }, { onConflict: "key" }).catch(function () {});
  }
  function renderKonfiguratorSettingsCard() {
    var card = el("div", { class: "card", style: "display:flex;flex-direction:column;gap:12px;" });

      }
      return card;
    }

    function toggleRow(label, key) {
      var row = el("label", { style: "display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;" }, []);
      var box = el("input", { type: "checkbox" });
      box.checked = konfEinstellungen[key] !== false;
      box.addEventListener("change", function (e) {
        konfEinstellungen[key] = e.target.checked;
        saveKonfEinstellungen(konfEinstellungen);
        render();
      });
      row.appendChild(box);
      row.appendChild(document.createTextNode(" " + label));
      return row;
    }
    card.appendChild(toggleRow("Produktion sichtbar", "produktionSichtbar"));
    card.appendChild(toggleRow("Kalkulation sichtbar", "kalkulationSichtbar"));

  function renderLogoSettingsCard() {
    var s = getSettings();
    var card = el("div", { class: "card", style: "display:flex;flex-direction:column;gap:12px;" });
    card.appendChild(el("h3", { style: "margin:0;" }, ["Logo"]));
    var preview = el("div", { style: "display:flex;align-items:center;gap:14px;flex-wrap:wrap;" });
    preview.appendChild(el("img", { src: getLogoFull(), alt: "Aktuelles Logo", style: "height:48px;max-width:220px;object-fit:contain;background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--line);" }));

    card.appendChild(preview);

    var status = el("p", { style: "margin:0;font-size:12px;color:var(--muted);" }, ["Wähle eine Bilddatei (PNG/JPG), um das Logo zu ersetzen."]);
    card.appendChild(status);

    var actions = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;" });
    var resetBtn = el("button", { class: "btn" }, ["Standard-Logo verwenden"]);
    resetBtn.addEventListener("click", function () {
      if (!db) return;
      db.doc("settings/main").update({ logoDataUrl: null, updatedAt: new Date().toISOString() }).catch(function () {});
    });
    actions.appendChild(resetBtn);
    card.appendChild(actions);

    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var maxW = 360;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL("image/png");
          if (!db) { alert("Keine Verbindung zur Datenbank."); return; }
          status.textContent = "Wird gespeichert …";
          db.doc("settings/main").update({ logoDataUrl: dataUrl, updatedAt: new Date().toISOString() }).then(function () {
            status.textContent = "Logo aktualisiert.";
          }).catch(function () { status.textContent = "Speichern nicht möglich (Bild eventuell zu groß)."; });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    return card;
  }

    });
    card.appendChild(list);

    var addRow = el("div", { class: "add-person-row", style: "flex-wrap:wrap;" });
    var addInput = el("input", { type: "text", placeholder: "Name neuer Mitarbeiter …" });
    var addPw1 = el("input", { type: "password", placeholder: "Passwort (mind. 4 Zeichen) …" });
    var addPw2 = el("input", { type: "password", placeholder: "Passwort bestätigen …" });
    var addErr = el("p", { style: "margin:0;width:100%;font-size:12px;color:var(--danger);" }, []);
    var addBtn = el("button", { class: "btn btn-primary" }, ["Hinzufügen"]);
    function addPerson() {
      var name = addInput.value.trim();
      var v1 = addPw1.value, v2 = addPw2.value;
      addErr.textContent = "";
      if (!name) { addInput.focus(); return; }
      var exists = state.team.some(function (m) { return (m.name || "").toLowerCase() === name.toLowerCase(); });
      if (exists) { addErr.textContent = "Diesen Namen gibt es schon."; return; }
      if (!v1 || v1.length < 4) { addErr.textContent = "Bitte ein Passwort mit mindestens 4 Zeichen vergeben."; return; }
      if (v1 !== v2) { addErr.textContent = "Die Passwörter stimmen nicht überein."; return; }
      if (!db) { addErr.textContent = "Keine Verbindung zur Datenbank."; return; }
      sha256Hex(v1).then(function (hash) {
        db.collection("team").add({ name: name, createdAt: new Date().toISOString(), passwordHash: hash }).then(function () {
          addInput.value = ""; addPw1.value = ""; addPw2.value = "";
        }).catch(function () { addErr.textContent = "Anlegen nicht möglich."; render(); });
      });
    }
    [addInput, addPw1, addPw2].forEach(function (f) { f.addEventListener("keydown", function (e) { if (e.key === "Enter") addPerson(); }); });
    addBtn.addEventListener("click", addPerson);
    addRow.appendChild(addInput);
    addRow.appendChild(addPw1);
    addRow.appendChild(addPw2);
    addRow.appendChild(addErr);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    return card;
  }

  function renderPasswordSettingsCard() {
    var card = el("div", { class: "card", style: "display:flex;flex-direction:column;gap:12px;" });
    card.appendChild(el("h3", { style: "margin:0;" }, ["Chef-Passwort ändern"]));
    var p1 = fieldInput("Neues Passwort", "np1", "", "");
    p1.input.type = "password";
    var p2 = fieldInput("Passwort bestätigen", "np2", "", "");
    p2.input.type = "password";
    var msg = el("p", { style: "margin:0;font-size:12.5px;color:var(--muted);" }, [""]);
    card.appendChild(p1.wrap);
    card.appendChild(p2.wrap);
    card.appendChild(msg);
    var saveBtn = el("button", { class: "btn btn-primary", style: "align-self:flex-end;" }, ["Passwort ändern"]);
    saveBtn.addEventListener("click", function () {
      var v1 = p1.input.value, v2 = p2.input.value;
      if (!v1 || v1.length < 4) { msg.textContent = "Bitte mindestens 4 Zeichen verwenden."; msg.style.color = "var(--danger)"; return; }
      if (v1 !== v2) { msg.textContent = "Die Passwörter stimmen nicht überein."; msg.style.color = "var(--danger)"; return; }
      sha256Hex(v1).then(function (hash) {
        if (!db) { msg.textContent = "Keine Verbindung zur Datenbank."; msg.style.color = "var(--danger)"; return; }
        db.doc("settings/main").update({ passwordHash: hash, updatedAt: new Date().toISOString() }).then(function () {
          msg.textContent = "Passwort geändert.";
          msg.style.color = "var(--success)";
          p1.input.value = ""; p2.input.value = "";
        }).catch(function () { msg.textContent = "Speichern nicht möglich."; msg.style.color = "var(--danger)"; });
      });
    });
    card.appendChild(saveBtn);
    return card;
  }

  window.__thbp_internal = { render: render };
})();
</script>
